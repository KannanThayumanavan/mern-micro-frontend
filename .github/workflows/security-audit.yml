name: Security Audit

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - client
          - server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Check if package.json exists
        id: check_package
        run: |
          if [ -f "${{ matrix.directory }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_package.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --prefer-offline
          else
            npm install
          fi

      - name: Run npm audit
        if: steps.check_package.outputs.exists == 'true'
        id: npm_audit
        working-directory: ${{ matrix.directory }}
        run: |
          echo "Running npm audit in directory: ${{ matrix.directory }}"
          npm audit --audit-level=high --json > npm-audit-report.json 2>&1 || true
          npm audit --audit-level=high 2>&1 | tee npm-audit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload npm audit report
        if: steps.check_package.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ matrix.directory == '.' && 'root' || matrix.directory }}
          path: |
            ${{ matrix.directory }}/npm-audit-report.json
            ${{ matrix.directory }}/npm-audit-output.txt
          retention-days: 30

      - name: Comment PR with audit results
        if: >
          steps.check_package.outputs.exists == 'true' &&
          github.event_name == 'pull_request' &&
          steps.npm_audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const dir = '${{ matrix.directory }}';
            const displayDir = dir === '.' ? 'root' : dir;
            let auditOutput = '';
            try {
              auditOutput = fs.readFileSync(`${dir}/npm-audit-output.txt`, 'utf8');
            } catch (e) {
              auditOutput = 'Could not read audit output file.';
            }
            const maxLength = 60000;
            if (auditOutput.length > maxLength) {
              auditOutput = auditOutput.substring(0, maxLength) + '\n... (truncated)';
            }
            const body = `## 🔒 Security Audit Results — \`${displayDir}\`

            ⚠️ **npm audit detected HIGH or CRITICAL vulnerabilities** in the \`${displayDir}\` directory.

            <details>
            <summary>Click to expand audit output</summary>

            \`\`\`
            ${auditOutput}
            \`\`\`

            </details>

            **Action Required:** Please resolve all HIGH and CRITICAL vulnerabilities before merging.

            > Triggered by: SCRUM-26 | Workflow: \`security-audit.yml\``;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: vars.ENABLE_SNYK_SCAN == 'true' || secrets.SNYK_TOKEN != ''
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - client
          - server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Check if package.json exists
        id: check_package
        run: |
          if [ -f "${{ matrix.directory }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_package.outputs.exists == 'true'
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --prefer-offline
          else
            npm install
          fi

      - name: Run Snyk to check for vulnerabilities
        if: steps.check_package.outputs.exists == 'true'
        uses: snyk/actions/node@master
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >
            --severity-threshold=high
            --file=${{ matrix.directory }}/package.json
            --sarif-file-output=${{ matrix.directory }}/snyk-results.sarif

      - name: Upload Snyk SARIF results to GitHub Security tab
        if: steps.check_package.outputs.exists == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.directory }}/snyk-results.sarif
          category: snyk-${{ matrix.directory == '.' && 'root' || matrix.directory }}

      - name: Upload Snyk report artifact
        if: steps.check_package.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-${{ matrix.directory == '.' && 'root' || matrix.directory }}
          path: ${{ matrix.directory }}/snyk-results.sarif
          retention-days: 30

  security-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs:
      - npm-audit
    if: always()
    steps:
      - name: Check audit results
        run: |
          echo "=========================================="
          echo "  Security Audit Summary — SCRUM-26"
          echo "=========================================="
          echo ""
          NPM_RESULT="${{ needs.npm-audit.result }}"
          echo "NPM Audit Result: $NPM_RESULT"
          echo ""
          if [ "$NPM_RESULT" == "failure" ]; then
            echo "❌ SECURITY AUDIT FAILED"
            echo ""
            echo "HIGH or CRITICAL vulnerabilities were detected."
            echo "Please review the audit reports and resolve all"
            echo "HIGH and CRITICAL severity vulnerabilities before"
            echo "merging or deploying."
            echo ""
            echo "Recommended actions